services:
  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gatekeeper
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: python gatekeeper.py

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gatekeeper-test
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-mock-test-key}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: pytest -v --tb=short

  simulate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gatekeeper-simulate
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: python simulate_gatekeeper.py --scenario violation

  harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gatekeeper-harness
    env_file:
      - path: .env
        required: false
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: python build_harness.py --docs docs README.md --output context_harness.json
